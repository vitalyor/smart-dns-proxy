<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Мои устройства</title>
<style>
  /* Палитра и ритм взяты из панели управления: страница подписки — то же
     изделие, увиденное с другой стороны, и выглядеть должна так же.
     Внешние шрифты не подключаем: CSP страницы запрещает сторонние источники,
     поэтому системный стек — единственный честный вариант. */
  :root{
    --ground:#0d1220; --ground-2:#101728; --surface:#151d31; --surface-2:#1b2439;
    --line:#253150; --line-soft:#1c2540;
    --text:#e6ebf5; --text-2:#9aa8c4; --text-3:#7d8ba7;
    --direct:#4fd1c5; --managed:#f2a33c;
    --ok:#59d99a; --warn:#ffc86b; --danger:#ff6b6b;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgb(0 0 0/.4), 0 8px 24px -12px rgb(0 0 0/.6);
    --sheet-shadow:0 -8px 40px -12px rgb(0 0 0/.7);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root{
      --ground:#f4f6fa; --ground-2:#eef1f7; --surface:#ffffff; --surface-2:#f7f9fc;
      --line:#d8dfec; --line-soft:#e6ebf3;
      --text:#131a28; --text-2:#4f5c74; --text-3:#69768e;
      --direct:#0f8f84; --managed:#b96f0c;
      --ok:#17864f; --warn:#a06c00; --danger:#c33b3b;
      --shadow:0 1px 2px rgb(16 24 40/.05), 0 10px 28px -18px rgb(16 24 40/.35);
      --sheet-shadow:0 -8px 40px -18px rgb(16 24 40/.35);
      color-scheme:light;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);font:16px/1.55 var(--sans);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;
    padding:max(20px,env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom))}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .mark{width:30px;height:30px;flex:none}
  .brand{font-size:14px;font-weight:650}
  .brand-sub{font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}
  .spacer{flex:1}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
  h1{font-size:22px;line-height:1.25;margin:0;letter-spacing:-.01em}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:0 0 12px}
  .sub{color:var(--text-2);font-size:14px;margin:6px 0 0}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--text-2);
    background:var(--surface-2);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));
    background:color-mix(in srgb,var(--ok) 10%,var(--surface-2))}
  .pill.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line));
    background:color-mix(in srgb,var(--danger) 10%,var(--surface-2))}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0 0}
  @media(max-width:520px){.facts{grid-template-columns:repeat(2,1fr)}}
  .fact{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);
    padding:12px 14px;min-width:0}
  .fact dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:0 0 4px}
  .fact dd{margin:0;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .fact dd small{display:block;font-weight:400;font-size:12px;color:var(--text-3);font-variant-numeric:normal}

  .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:44px;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font:inherit;font-size:15px;font-weight:550;
    cursor:pointer;touch-action:manipulation;text-decoration:none;
    transition:background .16s ease,border-color .16s ease,transform .12s ease}
  .btn:hover:not(:disabled){border-color:var(--text-3)}
  .btn:active:not(:disabled){transform:scale(.985)}
  .btn:focus-visible{outline:2px solid var(--direct);outline-offset:2px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--direct);border-color:var(--direct);color:#04201e;font-weight:650}
  .btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--direct) 88%,#fff)}
  .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
  .btn.ghost{background:transparent}
  .btn.block{width:100%}
  .btn.lg{min-height:50px;font-size:16px}
  .btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
  .btn svg{width:18px;height:18px;flex:none}
  .icon-btn{width:38px;height:38px;min-height:38px;padding:0}

  .dev{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-soft)}
  .dev:first-child{border-top:0;padding-top:0}
  .dev-ico{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:10px;
    background:var(--surface-2);border:1px solid var(--line-soft);color:var(--text-2)}
  .dev-ico svg{width:20px;height:20px}
  .dev-main{flex:1;min-width:0}
  .dev-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dev-meta{color:var(--text-3);font-size:13px;margin-top:2px}
  .dev-meta .live{color:var(--ok)}
  .dev-acts{display:flex;gap:6px;flex:none}
  @media(max-width:460px){
    .dev{flex-wrap:wrap}
    .dev-acts{width:100%;justify-content:flex-end;margin-top:-4px}
  }
  .empty{color:var(--text-2);font-size:14px;margin:0;padding:6px 0 2px}

  .scrim{position:fixed;inset:0;background:rgb(4 8 18/.62);backdrop-filter:blur(3px);
    opacity:0;transition:opacity .2s ease;z-index:40}
  .scrim.on{opacity:1}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--surface);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:var(--sheet-shadow);
    max-height:min(88vh,88dvh);display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .26s cubic-bezier(.16,1,.3,1)}
  .sheet.on{transform:translateY(0)}
  @media(min-width:640px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,calc(100vw - 40px));
      border-radius:var(--radius);border:1px solid var(--line);
      transform:translate(-50%,-46%) scale(.97);opacity:0;
      transition:transform .22s cubic-bezier(.16,1,.3,1),opacity .18s ease}
    .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  }
  .sheet-head{position:relative;display:flex;align-items:center;gap:12px;padding:16px 18px;
    border-bottom:1px solid var(--line-soft);flex:none}
  .sheet-head h3{margin:0;font-size:16px;font-weight:650}
  .grabber{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;
    border-radius:2px;background:var(--line)}
  @media(min-width:640px){.grabber{display:none}}
  .sheet-body{padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet-foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line-soft);display:flex;gap:10px;flex:none}
  .sheet-foot .btn{flex:1}

  .plats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 16px}
  @media(max-width:400px){.plats{grid-template-columns:1fr}}
  .plat{display:flex;align-items:center;gap:10px;padding:12px;min-height:56px;text-align:left;
    border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);
    color:var(--text);font:inherit;font-size:15px;cursor:pointer;
    transition:border-color .16s ease,background .16s ease}
  .plat:hover{border-color:var(--text-3)}
  .plat:focus-visible{outline:2px solid var(--direct);outline-offset:2px}
  .plat[aria-pressed="true"]{border-color:var(--direct);
    background:color-mix(in srgb,var(--direct) 12%,var(--surface-2));cursor:default}
  .plat svg{width:22px;height:22px;flex:none;color:var(--text-2)}
  .plat[aria-pressed="true"] svg{color:var(--direct)}
  .plat small{display:block;color:var(--text-3);font-size:12px;line-height:1.35}

  label{display:block;font-size:13px;color:var(--text-2);margin:0 0 6px}
  input[type=text]{width:100%;font:inherit;font-size:16px;padding:11px 13px;border-radius:var(--radius-sm);
    border:1px solid var(--line);background:var(--ground-2);color:var(--text)}
  input[type=text]:focus{outline:2px solid var(--direct);outline-offset:-1px;border-color:var(--direct)}

  .addr{display:flex;align-items:center;gap:8px;background:var(--ground-2);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:10px 12px;margin:14px 0 0}
  .addr code{font:13px/1.5 var(--mono);word-break:break-all;flex:1;min-width:0}
  .steps{counter-reset:step;margin:18px 0 0;padding:0;list-style:none}
  .steps li{counter-increment:step;position:relative;padding:0 0 16px 34px}
  .steps li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;
    border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:650;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}
  .steps li:last-child{padding-bottom:0}
  .steps b{display:block;font-weight:600;margin-bottom:2px}
  .steps p{margin:0;color:var(--text-2);font-size:14px}

  .alert{border-radius:var(--radius-sm);padding:11px 13px;font-size:14px;margin-top:12px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--text-2)}
  .alert.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line));
    background:color-mix(in srgb,var(--danger) 8%,var(--surface-2))}
  .alert.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line));
    background:color-mix(in srgb,var(--ok) 8%,var(--surface-2));margin-top:0}
  .muted{color:var(--text-3);font-size:13px}

  /* Инструкция приезжает с сервера готовым HTML — стили её содержимого здесь. */
  .howto h2{font-size:15px;text-transform:none;letter-spacing:0;color:var(--text);margin:0 0 10px}
  .howto h3{font-size:14px;margin:18px 0 8px}
  .howto p{margin:0 0 10px;color:var(--text-2);font-size:15px}
  .howto ol,.howto ul{margin:0 0 12px;padding-left:20px;color:var(--text-2)}
  .howto li{margin:6px 0}
  .howto code{font:13px/1.4 var(--mono);background:var(--ground-2);border:1px solid var(--line);
    border-radius:5px;padding:2px 6px;word-break:break-all;color:var(--text)}
  .howto pre{background:var(--ground-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px;overflow-x:auto}
  .howto pre code{border:0;background:none;padding:0}
  .howto blockquote{margin:10px 0;padding:8px 0 8px 14px;border-left:3px solid var(--line);color:var(--text-3)}
  .howto img{max-width:100%;border-radius:var(--radius-sm);border:1px solid var(--line)}

  .foot{margin-top:26px;text-align:center;font-size:14px;color:var(--text-3)}
  .foot a{color:var(--direct)}

  .skeleton{display:block;height:22px;width:60%;border-radius:6px;background:var(--surface-2);
    animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="var(--surface-2)" stroke="var(--line)"/>
      <path d="M5 16h7" stroke="var(--managed)" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 16h7" stroke="var(--direct)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="3.5" fill="var(--direct)"/>
    </svg>
    <div>
      <div class="brand" id="brand">Мои устройства</div>
      <div class="brand-sub">личная страница</div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="state-pill" hidden></span>
  </header>

  <section class="card" id="hero" aria-busy="true">
    <h1 id="who"><span class="skeleton"></span></h1>
    <p class="sub" id="hero-sub">Загружаем вашу подписку…</p>
    <dl class="facts" id="facts" hidden>
      <div class="fact"><dt>Действует</dt><dd id="f-expires">—</dd></div>
      <div class="fact"><dt>Запросы</dt><dd id="f-queries">—</dd></div>
      <div class="fact"><dt>Устройства</dt><dd id="f-devices">—</dd></div>
    </dl>
    <button class="btn primary lg block" id="cta" style="margin-top:20px" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Настроить устройство
    </button>
    <p class="muted" id="cta-hint" style="margin:10px 0 0;text-align:center" hidden></p>
  </section>

  <section class="card" id="devices-card" hidden>
    <h2>Устройства</h2>
    <div id="devices"></div>
  </section>

  <div class="card" id="error-card" hidden><div class="alert bad" id="error-text" role="alert"></div></div>

  <p class="foot" id="support" hidden></p>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head">
    <div class="grabber"></div>
    <h3 id="sheet-title"></h3>
    <div class="spacer"></div>
    <button class="btn ghost icon-btn" id="sheet-close" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot"></div>
</div>

<script>
(function(){
  var base = location.pathname.replace(/\/+$/, "");
  var $ = function(id){ return document.getElementById(id); };
  var state = null, lastSig = null;

  // Платформы, а не типы профилей: человек знает «у меня айфон», а не
  // «apple_doh». Порядок — по частоте, не по алфавиту.
  var PLATFORMS = [
    { key:"ios",     type:"apple_doh",   label:"iPhone или iPad", hint:"профиль DNS",    icon:"apple"   },
    { key:"mac",     type:"apple_doh",   label:"Mac",             hint:"профиль DNS",    icon:"apple"   },
    { key:"android", type:"android_dot", label:"Android",         hint:"Private DNS",    icon:"android" },
    { key:"windows", type:"windows_doh", label:"Windows 11",      hint:"защищённый DNS", icon:"windows" },
    { key:"router",  type:"router",      label:"Роутер",          hint:"весь дом сразу", icon:"router"  }
  ];

  var ICONS = {
    apple:'<path d="M16.7 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.8-3.6.8-.7 0-1.9-.8-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.2 1.7 2.4 3 2.4 1.2 0 1.7-.8 3.1-.8 1.4 0 1.9.8 3.1.8 1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.6-1-2.6-4z"/><path d="M14.5 5.8c.7-.8 1.1-1.9 1-3-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.5z"/>',
    android:'<path d="M6 10.5v6.2a1.3 1.3 0 0 0 1.3 1.3h9.4a1.3 1.3 0 0 0 1.3-1.3v-6.2z"/><path d="M4 11v4.5M20 11v4.5" stroke-linecap="round"/><path d="M9 18v2.2M15 18v2.2" stroke-linecap="round"/><path d="M8.5 7.2 7.3 5.4M15.5 7.2l1.2-1.8" stroke-linecap="round"/><path d="M6 10.5a6 6 0 0 1 12 0"/><path d="M10 8.6h.01M14 8.6h.01" stroke-linecap="round"/>',
    windows:'<path d="M3.5 6.6 10.4 5.6v6.1H3.5z"/><path d="M11.8 5.4 20.5 4v7.7h-8.7z"/><path d="M3.5 12.9h6.9V19L3.5 18z"/><path d="M11.8 13h8.7v7l-8.7-1.3z"/>',
    router:'<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h4" stroke-linecap="round"/><path d="M8.5 9.5a5 5 0 0 1 7 0M6 7a8.5 8.5 0 0 1 12 0" stroke-linecap="round"/>',
    dns:'<circle cx="12" cy="12" r="8"/><path d="M4 12h16"/><path d="M12 4c2.2 2.3 3.4 5.1 3.4 8S14.2 17.7 12 20c-2.2-2.3-3.4-5.1-3.4-8S9.8 6.3 12 4z"/>'
  };
  function icon(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.dns) + '</svg>';
  }
  function platformOf(type){
    for (var i = 0; i < PLATFORMS.length; i++){ if (PLATFORMS[i].type === type) return PLATFORMS[i]; }
    return { label: type, icon: "dns" };
  }

  function api(path, opts){
    return fetch(base + path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(b){
        return { ok: r.ok, status: r.status, body: b };
      });
    });
  }
  function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function nfmt(n){ return (n || 0).toLocaleString("ru-RU"); }

  function when(ms){
    if(!ms) return "ещё не подключалось";
    var d = (Date.now() - new Date(ms).getTime()) / 1000;
    if(d < 300) return "активно сейчас";
    if(d < 3600) return Math.round(d/60) + " мин назад";
    if(d < 86400) return Math.round(d/3600) + " ч назад";
    return Math.round(d/86400) + " дн назад";
  }
  function dateFmt(iso){
    return new Date(iso).toLocaleDateString("ru-RU", { day:"numeric", month:"long", year:"numeric" });
  }

  /* --- лист снизу на телефоне, окно на десктопе -----------------------------
     Один элемент на все случаи: содержимое подставляется. Фокус запирается
     внутри, Esc и клик по фону закрывают, после закрытия фокус возвращается
     туда, откуда открыли. */
  var sheetPrev = null, sheetOpen = false;

  function openSheet(title, bodyHTML, footHTML){
    if(!sheetOpen) sheetPrev = document.activeElement;
    $("sheet-title").textContent = title;
    $("sheet-body").innerHTML = bodyHTML;
    $("sheet-foot").innerHTML = footHTML || "";
    $("sheet-foot").hidden = !footHTML;
    $("scrim").hidden = false; $("sheet").hidden = false;
    document.body.style.overflow = "hidden";
    sheetOpen = true;
    requestAnimationFrame(function(){
      $("scrim").classList.add("on"); $("sheet").classList.add("on");
      var f = $("sheet-body").querySelector("button,input,a[href]");
      (f || $("sheet-close")).focus();
    });
    wireClose();
  }
  function closeSheet(){
    if(!sheetOpen) return;
    sheetOpen = false;
    $("scrim").classList.remove("on"); $("sheet").classList.remove("on");
    document.body.style.overflow = "";
    setTimeout(function(){
      if(sheetOpen) return;
      $("scrim").hidden = true; $("sheet").hidden = true;
      $("sheet-body").innerHTML = ""; $("sheet-foot").innerHTML = "";
    }, 260);
    if(sheetPrev && sheetPrev.focus) sheetPrev.focus();
  }
  function wireClose(){
    Array.prototype.forEach.call($("sheet").querySelectorAll("[data-close]"), function(b){
      b.onclick = closeSheet;
    });
  }
  $("sheet-close").onclick = closeSheet;
  $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", function(e){
    if(!sheetOpen) return;
    if(e.key === "Escape"){ closeSheet(); return; }
    if(e.key !== "Tab") return;
    var f = $("sheet").querySelectorAll('button:not([disabled]),input,a[href]');
    if(!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  /* --- главный экран -------------------------------------------------------- */
  function render(){
    var s = state;
    $("hero").setAttribute("aria-busy", "false");
    if(s.brand){ $("brand").textContent = s.brand; document.title = s.brand; }
    $("who").textContent = s.name || "Мои устройства";

    var reason = s.enabled === false ? "доступ отключён"
      : (s.expires_at && new Date(s.expires_at) < new Date()) ? "срок закончился"
      : "исчерпан лимит запросов";
    $("state-pill").className = "pill " + (s.active ? "ok" : "bad");
    $("state-pill").innerHTML = '<span class="dot"></span>' + (s.active ? "активна" : esc(reason));
    $("state-pill").hidden = false;

    var devs = s.devices || [];
    $("hero-sub").textContent = s.active
      ? (devs.length ? "Подписка работает. Ниже — что у вас настроено."
                     : "Подписка работает. Настройте первое устройство — это займёт минуту.")
      : "Подписка не действует: " + reason + ". Устройства не отвечают, пока она не возобновлена.";

    $("f-expires").textContent = s.expires_at ? dateFmt(s.expires_at) : "Бессрочно";
    $("f-queries").innerHTML = s.query_limit
      ? nfmt(s.queries_used) + "<small>из " + nfmt(s.query_limit) + "</small>"
      : nfmt(s.queries_used) + "<small>без ограничения</small>";
    $("f-devices").textContent = devs.length + " из " + s.device_limit;
    $("facts").hidden = false;

    var full = devs.length >= s.device_limit;
    $("cta").hidden = false;
    $("cta").disabled = full || !s.active;
    $("cta-hint").hidden = !(full || !s.active);
    $("cta-hint").textContent = !s.active
      ? "Пока подписка не действует, добавлять устройства нельзя."
      : full ? "Достигнут лимит устройств — удалите ненужное, чтобы добавить новое." : "";

    // Список перерисовывается только при смене состава: иначе автообновление
    // раз в 30 секунд дёргало бы DOM под руками у человека.
    var sig = devs.map(function(d){ return d.id + ":" + d.name + ":" + d.type; }).join("|");
    if(sig !== lastSig){
      lastSig = sig;
      $("devices").innerHTML = devs.length ? devs.map(function(d){
        var p = platformOf(d.type);
        return '<div class="dev">'
          + '<div class="dev-ico">' + icon(p.icon) + '</div>'
          + '<div class="dev-main">'
          +   '<div class="dev-name">' + esc(d.name) + '</div>'
          +   '<div class="dev-meta" id="meta-' + d.id + '">' + meta(d) + '</div>'
          + '</div>'
          + '<div class="dev-acts">'
          +   '<button class="btn sm" type="button" data-how="' + d.id + '">Как настроить</button>'
          +   '<button class="btn sm ghost danger icon-btn" type="button" data-del="' + d.id + '" aria-label="Удалить ' + esc(d.name) + '">'
          +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">'
          +     '<path d="M4 7h16M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>'
          +     '<path d="M6.5 7 7 19a1.5 1.5 0 0 0 1.5 1.4h7A1.5 1.5 0 0 0 17 19l.5-12"/></svg>'
          +   '</button>'
          + '</div>'
          + '</div>';
      }).join("") : '<p class="empty">Пока ни одного. Нажмите «Настроить устройство» — это займёт минуту.</p>';

      Array.prototype.forEach.call($("devices").querySelectorAll("[data-del]"), function(b){
        b.onclick = function(){ askDelete(b.getAttribute("data-del")); };
      });
      Array.prototype.forEach.call($("devices").querySelectorAll("[data-how]"), function(b){
        b.onclick = function(){ showHowto(b.getAttribute("data-how")); };
      });
    } else {
      devs.forEach(function(d){ var el = $("meta-" + d.id); if(el) el.innerHTML = meta(d); });
    }
    $("devices-card").hidden = false;
  }

  function meta(d){
    var p = platformOf(d.type);
    var seen = when(d.last_seen_at);
    var seenHTML = seen === "активно сейчас" ? '<span class="live">' + seen + '</span>' : esc(seen);
    return esc(p.label) + ' · ' + seenHTML + (d.queries_total ? ' · ' + nfmt(d.queries_total) + ' запросов' : '');
  }

  function fail(msg){
    $("error-text").textContent = msg;
    $("error-card").hidden = false;
    $("hero").setAttribute("aria-busy", "false");
    $("who").textContent = "Не удалось открыть страницу";
    $("hero-sub").textContent = "";
  }

  function load(){
    return api("/api/status").then(function(r){
      if(!r.ok){
        fail(r.status === 404 ? "Ссылка не найдена. Проверьте адрес или попросите новую."
                              : (r.body.error || "Не удалось загрузить данные."));
        return;
      }
      state = r.body; $("error-card").hidden = true; render(); support(state);
    }).catch(function(){ fail("Нет связи с сервером."); });
  }

  function support(s){
    var sup = (s.support || "").trim();
    if(!sup) return;
    var href = /^https?:\/\//.test(sup) ? sup : sup.charAt(0) === "@" ? "https://t.me/" + sup.slice(1) : "";
    $("support").innerHTML = "Нужна помощь? " + (href
      ? '<a href="' + esc(href) + '" rel="noopener noreferrer">' + esc(sup) + '</a>' : esc(sup));
    $("support").hidden = false;
  }

  /* --- установка: платформа → имя → готовый адрес --------------------------- */
  $("cta").onclick = function(){ installStep1(); };

  function installStep1(){
    var body = '<p class="muted" style="margin:0 0 14px">Выберите, куда ставим. Адрес будет личным для этого устройства.</p>'
      + '<div class="plats">' + PLATFORMS.map(function(p, i){
          return '<button class="plat" type="button" data-plat="' + i + '">'
            + icon(p.icon) + '<span>' + esc(p.label) + '<small>' + esc(p.hint) + '</small></span></button>';
        }).join("") + '</div>';
    openSheet("Настроить устройство", body, '<button class="btn" type="button" data-close>Отмена</button>');
    Array.prototype.forEach.call($("sheet-body").querySelectorAll("[data-plat]"), function(b){
      b.onclick = function(){ installStep2(PLATFORMS[+b.getAttribute("data-plat")]); };
    });
  }

  function installStep2(p){
    var body = '<div class="plat" aria-pressed="true" style="margin-bottom:16px">'
        + icon(p.icon) + '<span>' + esc(p.label) + '<small>' + esc(p.hint) + '</small></span></div>'
      + '<label for="dname">Название устройства</label>'
      + '<input type="text" id="dname" maxlength="60" value="' + esc(p.label) + '" autocomplete="off">'
      + '<p class="muted" style="margin:8px 0 0">Чтобы вы узнали его в списке — например «Рабочий ноутбук».</p>'
      + '<div id="install-msg"></div>';
    openSheet("Настроить устройство", body,
      '<button class="btn" type="button" data-back>Назад</button>'
      + '<button class="btn primary" type="button" id="do-add">Получить настройку</button>');
    $("sheet-foot").querySelector("[data-back]").onclick = installStep1;

    var input = $("dname");
    input.focus(); input.select();
    input.onkeydown = function(e){ if(e.key === "Enter") add(); };
    $("do-add").onclick = add;

    function msg(html){ var m = $("install-msg"); if(m) m.innerHTML = html; }
    function add(){
      var name = input.value.trim();
      if(!name){ msg('<div class="alert bad">Укажите название устройства.</div>'); input.focus(); return; }
      var btn = $("do-add");
      btn.disabled = true; btn.textContent = "Создаём…";
      api("/api/devices", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, type: p.type })
      }).then(function(r){
        btn.disabled = false; btn.textContent = "Получить настройку";
        if(!r.ok){
          msg('<div class="alert bad">' + esc(r.body.message || r.body.error || "Не удалось добавить устройство.") + '</div>');
          return;
        }
        load();
        installStep3(p, r.body.device);
      }).catch(function(){
        btn.disabled = false; btn.textContent = "Получить настройку";
        msg('<div class="alert bad">Нет связи с сервером.</div>');
      });
    }
  }

  function installStep3(p, dev){
    var apple = p.type === "apple_doh" || p.type === "apple_dot";
    var addr = p.type === "android_dot" ? (dev.dot_host || "") : (dev.doh_url || "");
    var steps = apple ? [
        ["Скачайте профиль", "Кнопка ниже. Файл откроется в настройках устройства."],
        ["Установите его", p.key === "mac"
          ? "Системные настройки → Основные → VPN и управление устройством → установить профиль."
          : "Настройки → Профиль загружен → Установить, затем введите код-пароль."],
        ["Проверьте", "Через минуту откройте нужный сервис. Больше ничего настраивать не нужно."]
      ] : p.type === "android_dot" ? [
        ["Скопируйте адрес", "Кнопка справа от адреса."],
        ["Настройки → Сеть и интернет → Частный DNS", "Выберите «Имя хоста провайдера частного DNS» и вставьте адрес."],
        ["Сохраните", "Значок сети моргнёт — это нормально. Через минуту всё работает."]
      ] : p.type === "windows_doh" ? [
        ["Скопируйте адрес", "Кнопка справа от адреса."],
        ["Параметры → Сеть → свойства подключения", "Назначение DNS-серверов → Изменить → Вручную, включите шифрование DNS и вставьте адрес."],
        ["Сохраните", "Проверьте, открыв нужный сервис."]
      ] : [
        ["Скопируйте адрес", "Кнопка справа от адреса."],
        ["Пропишите его в роутере", "Точные шаги для вашей прошивки — кнопка «Как настроить» в списке устройств."],
        ["Проверьте", "После применения переподключите Wi-Fi на телефоне."]
      ];

    var body = '<div class="alert ok" role="status">Устройство «' + esc(dev.name)
        + '» создано. Доступ включается в течение минуты.</div>'
      + (addr ? '<div class="addr"><code id="addr">' + esc(addr) + '</code>'
          + '<button class="btn sm" type="button" id="copy">Копировать</button></div>' : '')
      + '<ol class="steps">' + steps.map(function(s){
          return '<li><b>' + esc(s[0]) + '</b><p>' + esc(s[1]) + '</p></li>';
        }).join("") + '</ol>';

    var foot = apple
      ? '<button class="btn" type="button" data-close>Позже</button>'
        + '<a class="btn primary" href="' + base + '/api/devices/' + dev.id + '/config">Скачать профиль</a>'
      : '<button class="btn primary" type="button" data-close>Готово</button>';
    openSheet("Почти готово", body, foot);

    var copy = $("copy");
    if(copy) copy.onclick = function(){
      var text = $("addr").textContent;
      var done = function(){
        copy.textContent = "Скопировано";
        setTimeout(function(){ if(copy) copy.textContent = "Копировать"; }, 1800);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, fallback);
      } else fallback();
      function fallback(){
        var t = document.createElement("textarea");
        t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand("copy"); done(); } catch(e){ /* остаётся выделенным */ }
        document.body.removeChild(t);
      }
    };
  }

  /* --- инструкция и удаление ------------------------------------------------ */
  var howtoCache = {};
  function showHowto(id){
    var dev = (state.devices || []).filter(function(d){ return d.id === id; })[0] || {};
    var apple = dev.type === "apple_doh" || dev.type === "apple_dot";
    var foot = '<button class="btn" type="button" data-close>Закрыть</button>'
      + (apple ? '<a class="btn primary" href="' + base + '/api/devices/' + id + '/config">Скачать профиль</a>' : '');
    openSheet(dev.name || "Как настроить", '<p class="muted">Загружаем инструкцию…</p>', foot);

    var key = id + ":" + ((state && state.instructions_version) || "");
    if(howtoCache[key]){ $("sheet-body").innerHTML = '<div class="howto">' + howtoCache[key] + '</div>'; return; }
    api("/api/devices/" + id + "/instructions").then(function(r){
      if(!sheetOpen) return;
      if(!r.ok){
        $("sheet-body").innerHTML = '<div class="alert bad">Инструкция сейчас недоступна. Попробуйте позже.</div>';
        return;
      }
      howtoCache[key] = r.body.html;
      $("sheet-body").innerHTML = '<div class="howto">' + r.body.html + '</div>';
    }).catch(function(){
      if(sheetOpen) $("sheet-body").innerHTML = '<div class="alert bad">Нет связи с сервером.</div>';
    });
  }

  function askDelete(id){
    var dev = (state.devices || []).filter(function(d){ return d.id === id; })[0] || {};
    openSheet("Удалить устройство?",
      '<p style="margin:0">«' + esc(dev.name) + '» перестанет работать в течение минуты. '
      + 'Профиль на самом устройстве останется, но доступа больше не даст.</p><div id="del-msg"></div>',
      '<button class="btn" type="button" data-close>Отмена</button>'
      + '<button class="btn danger" type="button" id="do-del">Удалить</button>');
    $("do-del").onclick = function(){
      var b = $("do-del");
      b.disabled = true; b.textContent = "Удаляем…";
      api("/api/devices/" + id, { method: "DELETE" }).then(function(r){
        if(!r.ok){
          b.disabled = false; b.textContent = "Удалить";
          $("del-msg").innerHTML = '<div class="alert bad">'
            + esc(r.body.message || r.body.error || "Не удалось удалить устройство.") + '</div>';
          return;
        }
        closeSheet(); load();
      }).catch(function(){
        b.disabled = false; b.textContent = "Удалить";
        $("del-msg").innerHTML = '<div class="alert bad">Нет связи с сервером.</div>';
      });
    };
  }

  load();
  // Пока открыт лист, страницу не трогаем: человек в этот момент читает.
  setInterval(function(){ if(!sheetOpen) load(); }, 30000);
})();
</script>
</body>
</html>
