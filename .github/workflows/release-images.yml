name: Публикация образов

# Собирает и публикует готовые образы в GHCR, чтобы серверы их ТЯНУЛИ по тегу,
# а не собирали у себя. Образы публичные — исходники остаются приватными
# (в образ уезжает только стрипнутый бинарник, стадия сборки отбрасывается).
on:
  push:
    branches: [main]
    # Собираем только когда менялся код. Doc-only коммиты образы не пересобирают,
    # но любое изменение кода/Dockerfile/compose — пересобирает, чтобы новый код
    # гарантированно попал в пакет.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LAUNCH-PLAN.html'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VERSION: "2.0.0"
  REGISTRY: ghcr.io
  OWNER: vitalyor

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Короткий хеш коммита — им тегируем каждый образ, чтобы пакет всегда можно
      # было привязать к конкретному коду.
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Панель
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/panel/Dockerfile
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-panel:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-panel:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-panel:sha-${{ steps.sha.outputs.short }}

      - name: Нода (dns-frontend, sni-proxy, egress-relay, node-agent)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: node/deploy/Dockerfile
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-node:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-node:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-node:sha-${{ steps.sha.outputs.short }}

      - name: Unbound
        uses: docker/build-push-action@v6
        with:
          context: .
          file: node/deploy/unbound/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-unbound:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-unbound:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/smartdns-unbound:sha-${{ steps.sha.outputs.short }}
