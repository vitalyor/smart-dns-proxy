# Recursive, validating, caching resolver for the ingress node.
# It is reachable only from the internal Docker network — never from the
# Internet — so it can never be abused as an open resolver.
server:
    verbosity: 0
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Only the DNS frontend may query this resolver.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow

    # DNSSEC validation; a bogus answer becomes SERVFAIL, never a fake result.
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    qname-minimisation: yes
    aggressive-nsec: yes

    hide-identity: yes
    hide-version: yes

    # Short upstream outages should not break browsing.
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-client-timeout: 1800

    cache-min-ttl: 60
    cache-max-ttl: 86400
    msg-cache-size: 64m
    rrset-cache-size: 128m
    num-threads: 2
    so-reuseport: yes

    # Rebinding protection: upstream answers must not point into our networks.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 127.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    unwanted-reply-threshold: 10000000
    rrset-roundrobin: yes
    minimal-responses: yes
    edns-buffer-size: 1232

remote-control:
    control-enable: no

include: "/etc/unbound/unbound.conf.d/*.conf"
