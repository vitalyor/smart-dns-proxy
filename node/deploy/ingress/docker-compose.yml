# Ingress node: DNS frontend + Unbound + SNI proxy + agent.
# The agent owns the state volume; the data plane mounts it read-only and
# reloads the active artifact by itself — no Docker socket anywhere.
name: smartdns-ingress

x-logging: &logging
  # Docker's json-file driver keeps logs forever unless told otherwise; without
  # this a chatty container eventually fills the disk. 3 x 10 MiB per service.
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

x-node-image: &node-image
  image: ghcr.io/vitalyor/smartdns-node:${SMARTDNS_VERSION:-0.4.0}
  # Сеть хоста, а не публикация портов. Опубликованный порт Docker заворачивает
  # своими правилами раньше цепочек ufw, и ufw на него не действует: команда
  # выполняется, рапортует об успехе и не делает ничего. В сети хоста порты
  # обычные хостовые, и ufw остаётся единственной точкой управления ими.
  #
  # Процессы работают не от рута, а порты им нужны низкие, поэтому установщик
  # ставит net.ipv4.ip_unprivileged_port_start=0. В отдельной сети Docker делал
  # это сам внутри контейнера; в сети хоста поблажки нет.
  network_mode: host
  build:
    context: ../../..
    dockerfile: node/deploy/Dockerfile
    args:
      VERSION: ${SMARTDNS_VERSION:-0.4.0}
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &node-env
    SMARTDNS_CONFIG: /var/lib/smartdns-agent/active/config.json
    SMARTDNS_IDENTITY: /var/lib/smartdns-agent/identity
    TZ: ${TZ:-Europe/Moscow}
    LOG_LEVEL: ${LOG_LEVEL:-}

services:
  node-agent:
    <<: *node-image
    entrypoint: ["/usr/local/bin/node-agent"]
    environment:
      <<: *node-env
      NODE_ROLE: ingress
      # The bundle from the panel (Ноды → Добавить ноду). Provisions once, then
      # ignored, so it is safe to leave set.
      NODE_BUNDLE: ${NODE_BUNDLE:?NODE_BUNDLE is required — copy it from the panel}
      MGMT_ADDR: "${MGMT_BIND_ADDR:-}:${MGMT_BIND:-3333}"
      METRICS_ADDR: 127.0.0.1:9104
      # Where panel-issued DoT/DoH certs are written; dns-frontend mounts the
      # same dir read-only and hot-reloads them.
      TLS_DIR: /etc/smartdns/tls
      # The HTTP-01 challenge binds :80 only for the seconds an issuance runs.
      ACME_HTTP_ADDR: "${ACME_IP:-}:80"
      # Live query-log source: the agent proxies dns-frontend's ring to the panel
      # (GET /v1/dns/log). Internal to the compose network; never published.
      DNS_LOG_URL: http://127.0.0.1:9053/log
      # Per-device tallies (how many queries, when last seen). No domains.
      DNS_COUNTERS_URL: http://127.0.0.1:9053/counters
    volumes:
      - agentstate:/var/lib/smartdns-agent
      # Writable so the agent can drop issued certs here for dns-frontend.
      - ${TLS_DIR:-./tls}:/etc/smartdns/tls
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9104/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  unbound:
    # Единственный контейнер в собственной сети: он слушает 53, а в сети хоста
    # этот порт занят нашим же DNS. Публикуем его на петле хоста — правило
    # Docker для 127.0.0.1 снаружи недостижимо, так что мимо ufw ничего не
    # утекает, а образ пересобирать не нужно.
    image: ghcr.io/vitalyor/smartdns-unbound:${SMARTDNS_VERSION:-0.4.0}
    ports:
      - "127.0.0.1:5335:53/udp"
      - "127.0.0.1:5335:53/tcp"
    build:
      context: ../../..
      dockerfile: node/deploy/unbound/Dockerfile
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "drill", "-Q", "@127.0.0.1", "nlnetlabs.nl", "A"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  dns-frontend:
    <<: *node-image
    depends_on:
      node-agent: {condition: service_healthy}
      unbound: {condition: service_started}
    entrypoint: ["/usr/local/bin/dns-frontend"]
    environment:
      <<: *node-env
      DNS_UDP_ADDR: "${DNS_BIND:-127.0.0.1}:53"
      DNS_TCP_ADDR: "${DNS_BIND:-127.0.0.1}:53"
      DNS_DOT_ADDR: "${DNS_IP:-}:853"
      DNS_DOH_ADDR: "${DNS_IP:-}:${DOH_PORT:-8443}"
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/smartdns/tls/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/smartdns/tls/privkey.pem}
      ALLOW_SELF_SIGNED_TLS: ${ALLOW_SELF_SIGNED_TLS:-0}
      METRICS_ADDR: 127.0.0.1:9101
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - agentstate:/var/lib/smartdns-agent:ro
      - ${TLS_DIR:-./tls}:/etc/smartdns/tls:ro

  sni-proxy:
    <<: *node-image
    depends_on:
      node-agent: {condition: service_healthy}
    entrypoint: ["/usr/local/bin/sni-proxy"]
    environment:
      <<: *node-env
      PROXY_ADDR: "${PROXY_IP:-}:443"
      # A ClientHello whose SNI equals the DoH hostname is forwarded here, so DoH
      # can share :443 with managed HTTPS on a single public IP.
      DOH_BACKEND: 127.0.0.1:8443
      METRICS_ADDR: 127.0.0.1:9102
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - agentstate:/var/lib/smartdns-agent:ro

volumes:
  agentstate:
