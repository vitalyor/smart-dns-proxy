# Egress node: agent + relay. The relay accepts only ingress peers holding a
# certificate from the panel CA and only destinations in the active revision.
name: smartdns-egress

x-logging: &logging
  # Docker's json-file driver keeps logs forever unless told otherwise; without
  # this a chatty container eventually fills the disk. 3 x 10 MiB per service.
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

x-node-image: &node-image
  image: ghcr.io/vitalyor/smartdns-node:${SMARTDNS_VERSION:-0.4.0}
  # Сеть хоста, а не публикация портов. Опубликованный порт Docker заворачивает
  # своими правилами раньше цепочек ufw, и ufw на него не действует: команда
  # выполняется, рапортует об успехе и не делает ничего. В сети хоста порты
  # обычные хостовые, и ufw остаётся единственной точкой управления ими.
  network_mode: host
  build:
    context: ../../..
    dockerfile: node/deploy/Dockerfile
    args:
      VERSION: ${SMARTDNS_VERSION:-0.4.0}
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &node-env
    SMARTDNS_CONFIG: /var/lib/smartdns-agent/active/config.json
    SMARTDNS_IDENTITY: /var/lib/smartdns-agent/identity
    TZ: ${TZ:-Europe/Moscow}
    LOG_LEVEL: ${LOG_LEVEL:-}

services:
  node-agent:
    <<: *node-image
    entrypoint: ["/usr/local/bin/node-agent"]
    environment:
      <<: *node-env
      NODE_ROLE: egress
      NODE_BUNDLE: ${NODE_BUNDLE:?NODE_BUNDLE is required — copy it from the panel}
      MGMT_ADDR: "${MGMT_BIND_ADDR:-}:${MGMT_BIND:-3333}"
      # Метрики только на петле: в сети хоста 0.0.0.0 означало бы «наружу».
      METRICS_ADDR: 127.0.0.1:9104
    volumes:
      - agentstate:/var/lib/smartdns-agent
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9104/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  egress-relay:
    <<: *node-image
    depends_on:
      node-agent: {condition: service_healthy}
    entrypoint: ["/usr/local/bin/egress-relay"]
    environment:
      <<: *node-env
      RELAY_ADDR: "${RELAY_BIND_ADDR:-}:${RELAY_PORT:-8443}"
      METRICS_ADDR: 127.0.0.1:9103
    volumes:
      - agentstate:/var/lib/smartdns-agent:ro

volumes:
  agentstate:
