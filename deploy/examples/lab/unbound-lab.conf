# Lab-only: delegate the reserved `.test` zone to the mock authoritative server
# so ordinary-domain resolution still travels a real Unbound path.
server:
    # Unbound blocks the RFC 6761 special-use name `test.` by default; the lab
    # needs it delegated to the mock authoritative server instead.
    local-zone: "test." nodefault
    domain-insecure: "test."
    do-not-query-localhost: no
    private-domain: "test."

forward-zone:
    name: "test."
    forward-addr: 172.28.0.40
